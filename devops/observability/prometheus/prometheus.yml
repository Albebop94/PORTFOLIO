global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'portfolio-backend'
    # In a real environment, this would use service discovery (e.g., kubernetes_sd_configs)
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
